# Skill-vs-baseline experiment (dotnet/skills pattern)
name: pmcro-skills
evals:
  - tests/*/!\(agent.*\)/eval.yaml
overrides:
  model: claude-opus-4.6
  judge_model: claude-opus-4.6
vary:
  - /environment/skills
baseline: baseline
variants:
  baseline:
    environment:
      skills: []
  skilled:
    environment:
      skills:
        - plugins/${eval.grandparent}/skills/${eval.parent}
